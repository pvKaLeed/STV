name: Update VPNBook Servers

on:
  schedule:
    # ၁ နာရီတစ်ကြိမ် ပုံမှန် Run မည်
    - cron: '0 * * * *'
  workflow_dispatch: # Manual run ရအောင်လုပ်ပေးထားသည်

jobs:
  update-servers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Fetch Script
      run: python fetch_vpn.py

    - name: Commit and Push if updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add servers.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update top 5 VPNBook servers" && git push)

